<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Glassmorphism Drop Shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4a2258" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f7f2fb" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#eee6f5" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Glass Border Highlight -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d6c6e6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Luxury Gold Metallic Gradient for Icon -->
    <linearGradient id="goldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91610e"/>
      <stop offset="35%" stop-color="#d4a43a"/>
      <stop offset="70%" stop-color="#7e5111"/>
      <stop offset="100%" stop-color="#c5922e"/>
    </linearGradient>

    <!-- Subtle Icon Emboss Shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#552205" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Button Rounded Rectangle (Squircle) -->
  <rect x="8" y="8" width="104" height="84" rx="24" ry="24"
        fill="url(#glassBg)"
        stroke="url(#glassBorder)"
        stroke-width="2.5"
        filter="url(#btnShadow)"/>

  <!-- Top Inner Sheen -->
  <path d="M 32 10 Q 60 14 88 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Photo / Gallery Icon Group -->
  <g filter="url(#iconGlow)">
    <!-- Picture Frame with cut-out picture scene -->
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M 36 29
             C 33.2 29 31 31.2 31 34
             L 31 66
             C 31 68.8 33.2 71 36 71
             L 84 71
             C 86.8 71 89 68.8 89 66
             L 89 34
             C 89 31.2 86.8 29 84 29
             L 36 29 Z
             M 36 34
             L 84 34
             L 84 66
             L 36 66
             L 36 34 Z"
          fill="url(#goldIcon)"/>

    <!-- Sun / Moon inside picture frame -->
    <circle cx="46" cy="43" r="4.5" fill="url(#goldIcon)"/>

    <!-- Mountain Peaks inside frame -->
    <path d="M 39 63
             L 52 47
             C 53 45.8 54.8 45.8 55.8 47
             L 63 56
             L 69.2 49
             C 70.2 47.8 72 47.8 73 49
             L 81 63 Z"
          fill="url(#goldIcon)"/>
  </g>
</svg>
