<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Drop Shadow for Buttons -->
    <filter id="navBtnShadow" x="-15%" y="-15%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4a2258" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="navGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f8f4fb" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#eee6f5" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Glass Border Highlight -->
    <linearGradient id="navGlassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d6c6e6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Luxury Gold Metallic Gradient for Icon & Text -->
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91610e"/>
      <stop offset="35%" stop-color="#d4a43a"/>
      <stop offset="70%" stop-color="#7e5111"/>
      <stop offset="100%" stop-color="#c5922e"/>
    </linearGradient>

    <!-- Chevron Gold Gradient -->
    <linearGradient id="chevronGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a43a"/>
      <stop offset="100%" stop-color="#8a5712"/>
    </linearGradient>

    <!-- Icon Emboss Effect -->
    <filter id="navIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#552205" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ── Top Chevron Arrow Indicator ── -->
  <g stroke="url(#chevronGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 223 15 L 230 8 L 237 15"/>
    <path d="M 223 22 L 230 15 L 237 22"/>
  </g>

  <!-- ── Scroll Up Khmer Label: អូសឡើងទៅលើ ── -->
  <text x="230" y="38" text-anchor="middle"
        font-family="'Kantumruy Pro', 'Hanuman', serif"
        font-size="13" font-weight="700"
        fill="url(#navGold)"
        filter="drop-shadow(0 0 1px #fff) drop-shadow(0 1px 2px rgba(60, 30, 10, 0.35))">
    អូសឡើងទៅលើ
  </text>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- BUTTON 1: CALENDAR (X: 16 to 116) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g id="btn-calendar" transform="translate(16, 48)">
    <rect width="98" height="78" rx="20" ry="20"
          fill="url(#navGlassBg)" stroke="url(#navGlassBorder)" stroke-width="2"
          filter="url(#navBtnShadow)"/>
    <path d="M 25 3 Q 49 6 73 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    
    <g filter="url(#navIconGlow)">
      <rect x="27" y="23" width="44" height="38" rx="7" fill="url(#navGold)"/>
      <path d="M 27 33 L 71 33" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
      <rect x="36" y="16" width="5" height="10" rx="2.5" fill="url(#navGold)"/>
      <rect x="57" y="16" width="5" height="10" rx="2.5" fill="url(#navGold)"/>
      <!-- Dots -->
      <circle cx="37" cy="41" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="49" cy="41" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="61" cy="41" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="37" cy="50" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="49" cy="50" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="61" cy="50" r="2.5" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- BUTTON 2: LOCATION MAP PIN (X: 126 to 226) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g id="btn-location" transform="translate(126, 48)">
    <rect width="98" height="78" rx="20" ry="20"
          fill="url(#navGlassBg)" stroke="url(#navGlassBorder)" stroke-width="2"
          filter="url(#navBtnShadow)"/>
    <path d="M 25 3 Q 49 6 73 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    
    <g filter="url(#navIconGlow)">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M 49 17
               C 38.5 17 30 25.5 30 36
               C 30 49 46.2 61.5 48.3 63.1
               C 48.7 63.4 49.3 63.4 49.7 63.1
               C 51.8 61.5 68 49 68 36
               C 68 25.5 59.5 17 49 17 Z
               M 49 28
               C 53 28 56.2 31.2 56.2 35.2
               C 56.2 39.2 53 42.4 49 42.4
               C 45 42.4 41.8 39.2 41.8 35.2
               C 41.8 31.2 45 28 49 28 Z"
            fill="url(#navGold)"/>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- BUTTON 3: GALLERY / PHOTO (X: 236 to 336) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g id="btn-gallery" transform="translate(236, 48)">
    <rect width="98" height="78" rx="20" ry="20"
          fill="url(#navGlassBg)" stroke="url(#navGlassBorder)" stroke-width="2"
          filter="url(#navBtnShadow)"/>
    <path d="M 25 3 Q 49 6 73 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    
    <g filter="url(#navIconGlow)">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M 27 21
               C 24.5 21 22.5 23 22.5 25.5
               L 22.5 54.5
               C 22.5 57 24.5 59 27 59
               L 71 59
               C 73.5 59 75.5 57 75.5 54.5
               L 75.5 25.5
               C 75.5 23 73.5 21 71 21
               L 27 21 Z
               M 27 25.5
               L 71 25.5
               L 71 54.5
               L 27 54.5
               L 27 25.5 Z"
            fill="url(#navGold)"/>
      <circle cx="36" cy="33" r="4" fill="url(#navGold)"/>
      <path d="M 29.5 51.5
               L 41.5 37
               C 42.4 35.9 44 35.9 44.9 37
               L 51.5 45
               L 57 38.5
               C 57.9 37.4 59.5 37.4 60.4 38.5
               L 68.5 51.5 Z"
            fill="url(#navGold)"/>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- BUTTON 4: WISHES / CHAT (X: 346 to 446) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g id="btn-wishes" transform="translate(346, 48)">
    <rect width="98" height="78" rx="20" ry="20"
          fill="url(#navGlassBg)" stroke="url(#navGlassBorder)" stroke-width="2"
          filter="url(#navBtnShadow)"/>
    <path d="M 25 3 Q 49 6 73 3" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    
    <g filter="url(#navIconGlow)">
      <!-- Primary Bubble -->
      <path d="M 27 22
               C 25 22 23.5 23.5 23.5 25.5
               L 23.5 43.5
               C 23.5 45.5 25 47 27 47
               L 32 47
               L 32 54
               C 32 55 33.2 55.6 34 54.8
               L 41.5 47
               L 53 47
               C 55 47 56.5 45.5 56.5 43.5
               L 56.5 25.5
               C 56.5 23.5 55 22 53 22
               L 27 22 Z"
            fill="url(#navGold)"/>
      <!-- Lines inside -->
      <rect x="30" y="29" width="18" height="2.5" rx="1.2" fill="#ffffff" opacity="0.9"/>
      <rect x="30" y="35" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.9"/>
      <!-- Secondary Bubble -->
      <path d="M 60 29
               L 68 29
               C 70 29 71.5 30.5 71.5 32.5
               L 71.5 46.5
               C 71.5 48.5 70 50 68 50
               L 65.5 50
               L 65.5 56.5
               C 65.5 57.5 64.3 58 63.5 57.3
               L 57.5 50
               L 52 50
               C 50.8 50 50 49.5 49.3 48.8
               C 52 47.8 54 45.3 54.8 42
               L 60 42 Z"
            fill="url(#navGold)" opacity="0.85"/>
    </g>
  </g>
</svg>
